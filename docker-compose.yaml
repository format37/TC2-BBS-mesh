services:
  tc2-bbs-mesh:
    build: .
    restart: always
    environment:
      - TZ=Asia/Tbilisi
      # From .env next to this file (see .env.example); empty turns the Telegram bridge off
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./data:/home/mesh/bbs/config
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    group_add:
      - "20"  # dialout group for serial port access
    container_name: tc2-bbs-mesh
