###############################
#### Select Interface type ####
###############################
# [type = serial] for USB connected devices
#If there are multiple serial devices connected, be sure to use the "port" option and specify a port
# Linux Example:
# port = /dev/ttyUSB0
#
# Windows Example:
# port = COM3
# [type = tcp] for network connected devices (ESP32 devices only - this does not work for WisBlock)
# If using tcp, remove the # from the beginning and replace 192.168.x.x with the IP address of your device
# Example:
# [interface]
# type = tcp
# hostname = 192.168.1.100

[interface]
type = serial
port = /dev/ttyACM0
# hostname = 192.168.x.x


############################
#### BBS NODE SYNC LIST ####
############################
# Provide a list of other nodes running TC²-BBS to sync mail messages and bulletins with
# Enter in a list of other BBS Nodes by their nodeID separated by commas (no spaces)
# Example:
# [sync]
# bbs_nodes = !17d7e4b7,!18e9f5a3,!1a2b3c4d

[sync]
bbs_nodes =


############################
#### Allowed Node IDs ####
############################
# Provide a list of node IDs that are allowed to post to the urgent board.
# If this section is left empty, anyone can post to the urgent board.
# Example:
# allowed_nodes = !17d7e4b7,!18e9f5a3

[allow_list]
allowed_nodes =


####################
#### Admin Node ####
####################
# Admin node can delete any bulletin (not just their own)
# Leave empty for no admin privileges
# Example:
# admin_node = !abcd1234

[admin]
admin_node =

####################
#### Menu Items ####
####################
# Remove any menu items you don't plan on using with your BBS below
#
[menu]
# Default Main Menu options for reference
# [Q]uick Commands
# [B]BS
# [U]tilities
# [A]I Chat
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the main menu
main_menu_items = Q, B, U, A, X

# Default BBS Menu options for reference
# [M]ail
# [B]ulletins
# [C]hannel Dir
# [J]S8CALL
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the BBS menu
bbs_menu_items = M, B, C, J, X

# Default Utilities Menu option for reference
# [S]tats
# [F]ortune
# [W]all of Shame
# [L]ast users
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the utilities menu
utilities_menu_items = S, F, W, L, X


##########################
#### JS8Call Settings ####
##########################
# If you would like messages from JS8Call to go into the BBS, uncomment and enter in info below:
# host = the IP address for your system running JS8Call
# port = TCP API port for JS8CALL - Default is 2442
# db_file = this can be left as the default "js8call.db" unless you need to change for some reason
# js8groups = the JS8Call groups you're interested in receiving into the BBS
# store_messages = "true" will send messages that arent part of a group into the BBS (can be noisy). "false" will ignore these
# js8urgent = the JS8Call groups you consider to be urgent - anything sent to these will have a notice sent to the
# group chat (similar to how the urgent bulletin board works
# [js8call]
# host = 192.168.1.100
# port = 2442
# db_file = js8call.db
# js8groups = @GRP1,@GRP2,@GRP3
# store_messages = True
# js8urgent = @URGNT


######################
#### LLM Settings ####
######################
# Configure AI Chat feature with an LLM provider
# Currently supports OpenAI-compatible APIs
# The AI can check, read, send and delete mail, list, read, post and delete
# bulletins, show the channel directory and mesh status, and search the web.
# It asks the user to confirm every change with Y/N first.
#
# provider = the LLM provider (openai)
# model = the model to use; it must support tool calls (e.g., gpt-6-sol, gpt-5.4-mini, gpt-4o-mini)
# reasoning_effort = for reasoning models such as gpt-6-sol: none, which they need to call tools.
#                    Leave it empty for models without reasoning, such as gpt-4o-mini.
# api_key = your API key from the provider
# max_reply_messages = how many radio messages (200 bytes each) one AI reply may take (default 3)
#
# Example:
# [llm]
# provider = openai
# model = gpt-6-sol
# reasoning_effort = none
# api_key = sk-proj-your-api-key-here
# max_reply_messages = 3

[llm]
provider = openai
model = gpt-6-sol
reasoning_effort = none
api_key =
max_reply_messages = 3


#############################
#### Web Search Settings ####
#############################
# Lets the AI Chat search the web (news, weather, prices) with Perplexity Pro Search.
# Each search costs about $0.0016. Leave api_key empty to turn web search off.
#
# provider = the search provider (perplexity)
# api_key = your Perplexity API key
#
# Example:
# [web_search]
# provider = perplexity
# api_key = pplx-your-api-key-here

[web_search]
provider = perplexity
api_key =


#################################
#### Connection Settings ####
#################################
# Delay (in seconds) before exiting when serial connection is lost
# Docker will restart the container after this delay
# Example:
# restart_delay = 30

[connection]
restart_delay = 30


##########################
#### Quick Commands ####
##########################
# Customize quick command shortcuts
# Each command has format: prefix,enabled
# - prefix: the command shortcut (case-insensitive)
# - enabled: true/false to enable/disable the command
#
# Commands with arguments use ,, as delimiter (e.g., SM,,recipient,,subject,,message)
# Commands without arguments are just the prefix (e.g., CM to check mail)
#
# Example customizations:
# send_mail = MAIL,,,true     (change SM,, to MAIL,,)
# check_mail = CM,false       (disable check mail quick command)
#
[quick_commands]
send_mail = SM,,,true
check_mail = CM,true
post_bulletin = PB,,,true
check_bulletin = CB,,,true
post_channel = CHP,,,true
list_channels = CHL,true
last_users = LU,true
